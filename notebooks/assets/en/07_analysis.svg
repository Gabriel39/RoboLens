<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">07 / Analyze failure distributions</title><desc id="desc">Cohort: retrieved, reviewed attempts with usable, known outcomes. Similarity retrieval introduces selection bias. These rates are not deployment-wide rates or proof of causation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b" /></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb" />
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">07 / Analyze failure distributions</text>
<text x="30" y="73" font-size="14" fill="#52667a">Cohort: retrieved, reviewed attempts with usable, known outcomes</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb" />
<text x="50" y="136" font-size="18" font-weight="700" fill="#2563eb">Check coverage first</text>
<text x="50" y="170" font-size="14" font-weight="400" fill="#334e68">Retrieved → reviewed → eligible</text>
<text x="50" y="204" font-size="14" font-weight="400" fill="#334e68">Exclude other tasks and poor quality</text>
<text x="50" y="238" font-size="14" font-weight="400" fill="#334e68">Exclude unknown outcomes</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c" />
<text x="400" y="136" font-size="18" font-weight="700" fill="#08918c">Group and aggregate</text>
<text x="400" y="170" font-size="14" font-weight="400" fill="#334e68">Object × scene</text>
<text x="400" y="204" font-size="14" font-weight="400" fill="#334e68">Failures / attempts with known result</text>
<text x="400" y="238" font-size="14" font-weight="400" fill="#334e68">Then group by failure stage / cause</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce" />
<text x="750" y="136" font-size="18" font-weight="700" fill="#8452ce">Notebook charts</text>
<text x="750" y="170" font-size="14" font-weight="400" fill="#334e68">Coverage + failure distributions</text>
<text x="750" y="204" font-size="14" font-weight="400" fill="#334e68">See which conditions need attention</text>
<text x="750" y="238" font-size="14" font-weight="400" fill="#334e68">Always retain sample counts</text>
<text x="30" y="324" font-size="13" fill="#52667a">Similarity retrieval introduces selection bias. These rates are not deployment-wide rates or proof of causation.</text></g></svg>