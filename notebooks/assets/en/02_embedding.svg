<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">02 / Convert video frames to embeddings</title><desc id="desc">Processing: local model inference, no online embedding API. This version has no audio tracks, so audio_embeddings is empty. CLAP runs only when an audio stream exists.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b" /></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb" />
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">02 / Convert video frames to embeddings</text>
<text x="30" y="73" font-size="14" fill="#52667a">Processing: local model inference, no online embedding API</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb" />
<text x="50" y="136" font-size="18" font-weight="700" fill="#2563eb">Decode and sample</text>
<text x="50" y="170" font-size="14" font-weight="400" fill="#334e68">MP4 → RGB frames</text>
<text x="50" y="204" font-size="14" font-weight="400" fill="#334e68">frame_stride=15: about 1 frame/s</text>
<text x="50" y="238" font-size="14" font-weight="400" fill="#334e68">Preserve full video and state data</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c" />
<text x="400" y="136" font-size="18" font-weight="700" fill="#08918c">SigLIP2</text>
<text x="400" y="170" font-size="14" font-weight="400" fill="#334e68">Pinned model + revision</text>
<text x="400" y="204" font-size="14" font-weight="400" fill="#334e68">Image → 768-dimensional float32</text>
<text x="400" y="238" font-size="14" font-weight="400" fill="#334e68">L2-normalize every vector</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce" />
<text x="750" y="136" font-size="18" font-weight="700" fill="#8452ce">Two visual vectors</text>
<text x="750" y="170" font-size="14" font-weight="400" fill="#334e68">Frame + aggregated video vectors</text>
<text x="750" y="204" font-size="14" font-weight="400" fill="#334e68">Frame vectors locate similar times</text>
<text x="750" y="238" font-size="14" font-weight="400" fill="#334e68">Averages do not encode action order</text>
<text x="30" y="324" font-size="13" fill="#52667a">This version has no audio tracks, so audio_embeddings is empty. CLAP runs only when an audio stream exists.</text></g></svg>