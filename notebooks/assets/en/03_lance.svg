<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">03 / Write S3 / OSS Lance and build indexes</title><desc id="desc">Output: six business datasets and three operational datasets. Indexes live inside S3 / OSS datasets. Doris reuses them; vectors do not need to be copied into an internal table.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b" /></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb" />
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">03 / Write S3 / OSS Lance and build indexes</text>
<text x="30" y="73" font-size="14" fill="#52667a">Output: six business datasets and three operational datasets</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb" />
<text x="50" y="136" font-size="18" font-weight="700" fill="#2563eb">Stage batches</text>
<text x="50" y="170" font-size="14" font-weight="400" fill="#334e68">Arrow IPC → Lance</text>
<text x="50" y="204" font-size="14" font-weight="400" fill="#334e68">frames / episodes / metadata</text>
<text x="50" y="238" font-size="14" font-weight="400" fill="#334e68">media / frame / audio embeddings</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c" />
<text x="400" y="136" font-size="18" font-weight="700" fill="#08918c">Persist on S3 / OSS</text>
<text x="400" y="170" font-size="14" font-weight="400" fill="#334e68">Original MP4 bytes + vectors</text>
<text x="400" y="204" font-size="14" font-weight="400" fill="#334e68">Commit checkpoints after all tables</text>
<text x="400" y="238" font-size="14" font-weight="400" fill="#334e68">Resume from the last complete batch</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce" />
<text x="750" y="136" font-size="18" font-weight="700" fill="#8452ce">Build vector indexes</text>
<text x="750" y="170" font-size="14" font-weight="400" fill="#334e68">cosine IVF_PQ</text>
<text x="750" y="204" font-size="14" font-weight="400" fill="#334e68">Use IVF_FLAT below 256 rows</text>
<text x="750" y="238" font-size="14" font-weight="400" fill="#334e68">Publish index_status when complete</text>
<text x="30" y="324" font-size="13" fill="#52667a">Indexes live inside S3 / OSS datasets. Doris reuses them; vectors do not need to be copied into an internal table.</text></g></svg>