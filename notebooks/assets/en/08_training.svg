<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">08 / Select candidates for additional training</title><desc id="desc">Output: traceable episode / media / interval / training use. Failed actions are not automatically correct behavior-cloning targets. This workflow selects clips; it does not train.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b" /></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb" />
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">08 / Select candidates for additional training</text>
<text x="30" y="73" font-size="14" fill="#52667a">Output: traceable episode / media / interval / training use</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb" />
<text x="50" y="136" font-size="18" font-weight="700" fill="#2563eb">Filter candidates</text>
<text x="50" y="170" font-size="14" font-weight="400" fill="#334e68">Usable quality + real labels</text>
<text x="50" y="204" font-size="14" font-weight="400" fill="#334e68">Train split only; exclude used data</text>
<text x="50" y="238" font-size="14" font-weight="400" fill="#334e68">Require registry and valid intervals</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c" />
<text x="400" y="136" font-size="18" font-weight="700" fill="#08918c">Prevent data leakage</text>
<text x="400" y="170" font-size="14" font-weight="400" fill="#334e68">Check scene_group</text>
<text x="400" y="204" font-size="14" font-weight="400" fill="#334e68">Exclude groups spanning splits</text>
<text x="400" y="238" font-size="14" font-weight="400" fill="#334e68">Deduplicate scenes; 20 per bucket</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef" />
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce" />
<text x="750" y="136" font-size="18" font-weight="700" fill="#8452ce">Two training uses</text>
<text x="750" y="170" font-size="14" font-weight="400" fill="#334e68">Success → behavior-cloning positive</text>
<text x="750" y="204" font-size="14" font-weight="400" fill="#334e68">Failure → diagnosis or critic</text>
<text x="750" y="238" font-size="14" font-weight="400" fill="#334e68">Verify gains by independent evaluation</text>
<text x="30" y="324" font-size="13" fill="#52667a">Failed actions are not automatically correct behavior-cloning targets. This workflow selects clips; it does not train.</text></g></svg>