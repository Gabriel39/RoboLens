<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">01 / 读取原始数据</title><desc id="desc">输入：固定版本 lerobot/droid_100 v2.1。每个 episode 有三路相机；图像向量有三份视角，状态和动作不重复扩成三份。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">01 / 读取原始数据</text>
<text x="30" y="73" font-size="15" fill="#52667a">输入：固定版本 lerobot/droid_100 v2.1</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb"/>
<text x="50" y="136" font-size="19" font-weight="700" fill="#2563eb">源文件</text>
<text x="50" y="170" font-size="15" font-weight="400" fill="#334e68">100 个 episode</text>
<text x="50" y="204" font-size="15" font-weight="400" fill="#334e68">Parquet：状态、动作、时间戳</text>
<text x="50" y="238" font-size="15" font-weight="400" fill="#334e68">MP4：三路相机；JSONL：任务</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c"/>
<text x="400" y="136" font-size="19" font-weight="700" fill="#08918c">按 episode 读取</text>
<text x="400" y="170" font-size="15" font-weight="400" fill="#334e68">下载 → 校验 → 对齐</text>
<text x="400" y="204" font-size="15" font-weight="400" fill="#334e68">核对帧数和时间戳</text>
<text x="400" y="238" font-size="15" font-weight="400" fill="#334e68">保留源数据的数值类型</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce"/>
<text x="750" y="136" font-size="19" font-weight="700" fill="#8452ce">建立关联键</text>
<text x="750" y="170" font-size="15" font-weight="400" fill="#334e68">episode_index + frame_index</text>
<text x="750" y="204" font-size="15" font-weight="400" fill="#334e68">同一时间步共用状态 / 动作</text>
<text x="750" y="238" font-size="15" font-weight="400" fill="#334e68">media_id 定位对应相机视频</text>
<text x="30" y="324" font-size="14" fill="#52667a">每个 episode 有三路相机；图像向量有三份视角，状态和动作不重复扩成三份。</text></g></svg>