<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">03 / 写入 OSS Lance 并构建索引</title><desc id="desc">输出：六个业务 dataset + 三个运行记录 dataset。索引直接位于 OSS dataset 内；Doris 查询时复用它，不需要把全部向量复制到 Doris 内表。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">03 / 写入 OSS Lance 并构建索引</text>
<text x="30" y="73" font-size="15" fill="#52667a">输出：六个业务 dataset + 三个运行记录 dataset</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb"/>
<text x="50" y="136" font-size="19" font-weight="700" fill="#2563eb">分批暂存</text>
<text x="50" y="170" font-size="15" font-weight="400" fill="#334e68">Arrow IPC → Lance</text>
<text x="50" y="204" font-size="15" font-weight="400" fill="#334e68">frames / episodes / metadata</text>
<text x="50" y="238" font-size="15" font-weight="400" fill="#334e68">media / frame / audio embeddings</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c"/>
<text x="400" y="136" font-size="19" font-weight="700" fill="#08918c">OSS 持久化</text>
<text x="400" y="170" font-size="15" font-weight="400" fill="#334e68">原 MP4 字节 + 向量</text>
<text x="400" y="204" font-size="15" font-weight="400" fill="#334e68">每批多表写入后提交 checkpoint</text>
<text x="400" y="238" font-size="15" font-weight="400" fill="#334e68">中断后从完整批次恢复</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce"/>
<text x="750" y="136" font-size="19" font-weight="700" fill="#8452ce">构建向量索引</text>
<text x="750" y="170" font-size="15" font-weight="400" fill="#334e68">cosine IVF_PQ</text>
<text x="750" y="204" font-size="15" font-weight="400" fill="#334e68">不足 256 行改用 IVF_FLAT</text>
<text x="750" y="238" font-size="15" font-weight="400" fill="#334e68">完成后发布 index_status</text>
<text x="30" y="324" font-size="14" fill="#52667a">索引直接位于 OSS dataset 内；Doris 查询时复用它，不需要把全部向量复制到 Doris 内表。</text></g></svg>