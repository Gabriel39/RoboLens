<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">08 / 选出值得补充训练的候选</title><desc id="desc">输出：可追溯的 episode / media / 时间区间 / 训练用途。失败动作不直接作为行为克隆的正确动作；当前流程输出候选清单，不执行模型训练。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">08 / 选出值得补充训练的候选</text>
<text x="30" y="73" font-size="15" fill="#52667a">输出：可追溯的 episode / media / 时间区间 / 训练用途</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb"/>
<text x="50" y="136" font-size="19" font-weight="700" fill="#2563eb">候选过滤</text>
<text x="50" y="170" font-size="15" font-weight="400" fill="#334e68">质量合格 + 真实标签</text>
<text x="50" y="204" font-size="15" font-weight="400" fill="#334e68">仅 train，排除已训练样本</text>
<text x="50" y="238" font-size="15" font-weight="400" fill="#334e68">排除无登记或时间区间无效</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="380" y="102" width="6" height="184" rx="3" fill="#08918c"/>
<text x="400" y="136" font-size="19" font-weight="700" fill="#08918c">防止数据泄漏</text>
<text x="400" y="170" font-size="15" font-weight="400" fill="#334e68">检查 scene_group</text>
<text x="400" y="204" font-size="15" font-weight="400" fill="#334e68">排除跨 train / test 的场景组</text>
<text x="400" y="238" font-size="15" font-weight="400" fill="#334e68">按场景组去重，每桶最多 20 条</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce"/>
<text x="750" y="136" font-size="19" font-weight="700" fill="#8452ce">两类用途</text>
<text x="750" y="170" font-size="15" font-weight="400" fill="#334e68">成功 → 行为克隆正例</text>
<text x="750" y="204" font-size="15" font-weight="400" fill="#334e68">失败 → 诊断或 critic 候选</text>
<text x="750" y="238" font-size="15" font-weight="400" fill="#334e68">训练收益需独立评估验证</text>
<text x="30" y="324" font-size="14" fill="#52667a">失败动作不直接作为行为克隆的正确动作；当前流程输出候选清单，不执行模型训练。</text></g></svg>