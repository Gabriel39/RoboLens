<text x="400" y="136" font-size="19" font-weight="700" fill="#08918c">检索与复核</text>
<text x="400" y="170" font-size="15" font-weight="400" fill="#334e68">Lance 索引 + Vector Search</text>
<text x="400" y="204" font-size="15" font-weight="400" fill="#334e68">相似帧 → 完整视频片段</text>
<text x="400" y="238" font-size="15" font-weight="400" fill="#334e68">人来确认成败与原因</text>
<path d="M705,194 H725" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="730" y="102" width="6" height="184" rx="3" fill="#8452ce"/>
