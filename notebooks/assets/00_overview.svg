<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 356" width="1080" role="img" aria-labelledby="title desc">
<title id="title">从机器人数据到可追溯的训练候选</title><desc id="desc">DROID-100 · S3 / OSS Lance · Doris。演示中的每一步都复用项目代码；未连接环境时只展示流程，不伪造执行结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1080" height="356" rx="18" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
<text x="30" y="43" font-size="25" font-weight="700" fill="#102a43">从机器人数据到可追溯的训练候选</text>
<text x="30" y="73" font-size="15" fill="#52667a">DROID-100 · S3 / OSS Lance · Doris</text>
<rect x="30" y="102" width="320" height="184" rx="12" fill="white" stroke="#d9e3ef"/>
<rect x="30" y="102" width="6" height="184" rx="3" fill="#2563eb"/>
<text x="50" y="136" font-size="19" font-weight="700" fill="#2563eb">数据准备</text>
<text x="50" y="170" font-size="15" font-weight="400" fill="#334e68">Parquet / JSONL / MP4</text>
<text x="50" y="204" font-size="15" font-weight="400" fill="#334e68">保留状态、动作和原视频</text>
<text x="50" y="238" font-size="15" font-weight="400" fill="#334e68">本地模型生成图像向量</text>
<path d="M355,194 H375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
