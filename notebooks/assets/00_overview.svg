<text x="750" y="170" font-size="15" font-weight="400" fill="#334e68">Doris SQL + 训练登记</text>
<text x="750" y="204" font-size="15" font-weight="400" fill="#334e68">失败分布 / 场景去重</text>
<text x="750" y="238" font-size="15" font-weight="400" fill="#334e68">输出候选，不直接训练</text>
